# Release pipeline:
#   * push to main          → run the test suite (skipped for README/docs/
#                             examples-only changes — paths-ignore below);
#   * push a tag v<version> → build and publish a GitHub release with
#                             binaries for linux-amd64, linux-arm64 and
#                             windows-amd64.
#
# The plugin version (`-v`) is taken from the tag name via
# QELI_SS_PLUGIN_VERSION (see src/lib.rs).
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "README.md"
      - "README.ru.md"
      - "examples/**"
      - "**/*.md"
      - ".gitignore"
      - "LICENSE"

permissions:
  contents: write

jobs:
  test:
    # Test suite on main pushes (tag pushes go straight to build/release).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --locked

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are STATIC musl builds: no libc interpreter, so
          # they run on any distro/embedded system (OpenWrt, Entware on
          # Keenetic, routers, Alpine) regardless of the libc on the host.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: qeli-ss-plugin-linux-amd64
            zigbuild: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: qeli-ss-plugin-linux-arm64
            zigbuild: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: qeli-ss-plugin-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Linux targets are cross-compiled via cargo-zigbuild (musl → static).
      - name: Install cargo-zigbuild
        if: matrix.zigbuild
        shell: bash
        run: |
          pip install ziglang
          cargo install cargo-zigbuild

      - name: Build
        shell: bash
        env:
          QELI_SS_PLUGIN_VERSION: ${{ github.ref_name }}
        run: |
          if [ -n "${{ matrix.zigbuild }}" ]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Prepare artifact
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/qeli-ss-plugin.exe" "${{ matrix.artifact }}"
          else
            cp "target/${{ matrix.target }}/release/qeli-ss-plugin" "${{ matrix.artifact }}"
          fi
          ls -l "${{ matrix.artifact }}"

      # Guard: the Linux binaries must be static (no PT_INTERP) — a dynamic
      # build would fail with "not found" on musl systems (Entware/OpenWrt).
      - name: Verify static binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if readelf -l "${{ matrix.artifact }}" | grep -q INTERP; then
            echo "::error::binary is dynamic (PT_INTERP present) — must be a static musl build"
            exit 1
          fi
          echo "static OK"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
